    <h1 class="post-title entry-hint-parent">
      松软的世界
    </h1>
    <div class="post-meta"><span title='2023-12-17 12:29:00 +0800 CST'>2023年12月17日</span>&nbsp;·&nbsp;<span>线粒体</span>

</div>

  <div class="post-content"><p>已被情绪浇灌得松软的世界<br>
软绵绵的一切散发着单调的幽芳<br>
诚然不敢凑近去细嗅少许<br>
毕竟闪烁着冷峭的辉光</p>
<p>要将世界揉捏成一个密团<br>
粗糙的表面下是硬邦邦的内核<br>
一杵捣穿膨化的外壁<br>
喧嚣中传来凌厉的怒歌</p>
<p>用利斧将密团劈成两半<br>
虚胀的外壳气化并消散<br>
内核中流出滚烫的稠浆<br>
涌动着一股股肮脏的混乱</p>
<p>2023年12月4日</p>
