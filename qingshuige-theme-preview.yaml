# qingshuige-theme 本地预览覆盖配置
#
# 将此文件放到 qingshuige-hugo 根目录后，可在不修改现有 hugo.yaml
# （仍保持 PaperMod 为正式主题）的情况下预览 qingshuige-theme：
#
#   hugo server -D --config "hugo.yaml,qingshuige-theme-preview.yaml"
#
# Hugo 会按从左到右的优先级合并配置；本文件只提供新主题预览所需项目。

theme: qingshuige-theme

params:
  qingshuige:
    logo: "/favicon.png"

    avatar: "/qingshuige/defaults/avatar.png"
  

menus:
  main:
     - identifier: categories
       name: "文章分类"
       weight: 10


    # 全部文章
     - identifier: all_articles
       name: "全部文章"
       pageRef: "/blog"
       parent: categories
       weight: 10


    # 诗
     - identifier: category_poetry
       name: "诗"
       pageRef: "/categories/诗"
       parent: categories
       weight: 20


    # 文
     - identifier: category_prose
       name: "文"
       pageRef: "/categories/文"
       parent: categories
       weight: 30


    # 艺
     - identifier: category_art
       name: "艺"
       pageRef: "/categories/艺"
       parent: categories
       weight: 40


    # 科
     - identifier: category_science
       name: "学"
       pageRef: "/categories/学"
       parent: categories
       weight: 50


    # 其他
     - identifier: category_other
       name: "其他"
       pageRef: "/categories/其他"
       parent: categories
       weight: 60

    # 目前主站还没有“撰文指南”内容页，因此先作为待开发交互项显示。
     - identifier: writing_guide
       name: "撰文指南"
       weight: 20
       params:
        placeholder: true

     - identifier: site_preface
       name: "建站弁言"
       pageRef: "/categories/建站弁言"
       weight: 30

     - identifier: almanac_2025
       name: "年鉴2025"
       pageRef: "/categories/年鉴2025"
       weight: 40

    # 个人主页用头像代替文字。等目标地址确定后，删除 placeholder，
    # 并添加 pageRef（站内页面）或 url（站外个人主页）。
     - identifier: profile
       name: "个人主页"
       weight: 50
       params:
        avatar: true
        placeholder: true
